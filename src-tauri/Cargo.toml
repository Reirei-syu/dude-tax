[package]
name = "taxopt-helper"
version = "1.0.0"
description = "Dude Tax — 个人所得税预估与年终奖优化"
authors = ["Dude Tax"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "taxopt_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
